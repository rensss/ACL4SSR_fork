name: Generate Quantumult X Rules

on:
  push:
    branches:
      - master
    paths:
      - Clash/own/**
      - QuantumultX/rules-manifest.yaml
      - scripts/clash_own_to_qx.py
      - tests/**
      - requirements.txt
      - .github/workflows/generate-qx-rules.yml
  pull_request:
    paths:
      - Clash/own/**
      - QuantumultX/rules-manifest.yaml
      - scripts/clash_own_to_qx.py
      - tests/**
      - requirements.txt
      - .github/workflows/generate-qx-rules.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-qx-rules
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run converter tests
        run: python -m unittest discover -s tests -v

      - name: Generate QX rules
        run: python scripts/clash_own_to_qx.py

      - name: Commit generated QX rules
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- QuantumultX/own; then
            echo "QX rules are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QuantumultX/own
          git commit -m "[AutoUpdate] Generate Quantumult X rules"
          git push
